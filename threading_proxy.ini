; CRITICAL RULES:

; 1. Per-shape [NxD] sections must define all dispatch-tuning keys (batch sizes, chunk counts,

;    chunk_split_pct, chunk_group counts, prefetch distances, etc.). Global keys (cores_subtract,

;    worker_priority, use_physical_cores) live only in [proxy] and [default] ??? they are read

;    once at init and per-shape overrides are ineffective.

; 2. The XXL matrix sections [151936x1024] and [1024x151936] are PERMANENT ??? never remove them.

; 3. ALL sections and INI parameters may ONLY be removed when the corresponding code references

;    are removed from v7's source. Until then, every key in every section stays.

; 4. One key=value per line ??? NEVER put multiple key=value pairs on the same line.

;    GetPrivateProfileIntA only parses the first key=value on a line; trailing pairs are silently ignored.

; 5. The [default] section is the canonical parameter documentation with full rationale.

;    Per-shape sections mirror all keys with concise comments.



