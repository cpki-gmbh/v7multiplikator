# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection

# Linux lint gate (second audit P2): assemble the tree, run both comment
# checkers and the release hygiene gate on every push. ~10 s, needs only
# NASM (>= 2.16) and Python.
lint:
  stage: test
  image: alpine:3.20
  before_script:
    - apk add --no-cache nasm python3 git
    - nasm -v
  script:
    - python3 src/check_asm_comments.py
    - python3 src/check_logo_comments.py
    - python3 src/check_release.py .
    - mkdir -p build_tmp
    - nasm -f win64 -O0 -w-other -I src/asm src/asm/v7_threading.asm -o build_tmp/v7_threading.obj
    - nasm -f win64 -O0 -w-other -DTRACE_ENABLE -I src/asm src/asm/v7_threading.asm -o build_tmp/v7_threading_trace.obj

# Native Linux build: assemble + link the shared object and the host tools,
# then run the model-free validators (the model-dependent ones need a
# database blob that is not stored in the repository). Debian (glibc) mirrors
# the environment the port is developed and tested on (WSL2 Ubuntu 24.04).
build-linux:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends nasm gcc g++ make
    - nasm -v
    - gcc --version | head -1
  script:
    # the six model-free validators build + run here: model-dependent ones
    # need a database blob that is not stored in the repository
    - make -j"$(nproc)" all bin-linux/v_bicubic_validate bin-linux/v_encode_validate bin-linux/v_execute_validate bin-linux/v_mdb_validate bin-linux/v_readwrite_validate bin-linux/v_sprintf_validate
    - ls -la bin-linux/
    - ./bin-linux/v_bicubic_validate ./bin-linux/libv7_threading.so
    - ./bin-linux/v_encode_validate ./bin-linux/libv7_threading.so
    - ./bin-linux/v_execute_validate ./bin-linux/libv7_threading.so
    - ./bin-linux/v_mdb_validate ./bin-linux/libv7_threading.so
    - ./bin-linux/v_readwrite_validate ./bin-linux/libv7_threading.so
    - ./bin-linux/v_sprintf_validate ./bin-linux/libv7_threading.so
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
